name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Sign debug APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEY_STORE_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Read version name
        run: |
          VERSION_NAME=$(sed -n 's/^\s*versionName\s*"\([^"]\+\)".*/\1/p' app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          echo "VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Name signed APK
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" \
            "${{ github.workspace }}/prism_${{ env.VERSION }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-${{ env.VERSION }}
          path: ${{ github.workspace }}/prism_${{ env.VERSION }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/prism_${{ env.VERSION }}.apk
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
